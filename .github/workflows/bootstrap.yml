name: Bootstrap source

on:
  push:
    paths:
      - ".bootstrap/chunk5"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand source archive
        run: |
          rm -rf /tmp/sentinel-source /tmp/sentinel-source.zip
          mkdir -p /tmp/sentinel-source
          cat .bootstrap/chunk1 .bootstrap/chunk2 .bootstrap/chunk3 .bootstrap/chunk4 .bootstrap/chunk5 | base64 --decode --ignore-garbage > /tmp/sentinel-source.zip
          unzip -t /tmp/sentinel-source.zip
          unzip -q /tmp/sentinel-source.zip -d /tmp/sentinel-source
          rsync -a /tmp/sentinel-source/sentinel-osint-production/ ./ --exclude '.git'
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit complete repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "feat: publish SentinelOSINT full-stack platform"
            git push origin HEAD:main
          fi
# retry after archive repair
